# Общие настройки окна
pad=16x16
font=JetBrainsMono Nerd Font:size=14

# Тёмная тема (основная)
[colors-dark]
alpha=0.75
background=2e3440
foreground=d8dee9

selection-foreground=d8dee9
selection-background=3b4252

regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4

# Светлая тема (альтернативная)
[colors-light]
alpha=0.75
background=eceff4
foreground=2e3440

selection-foreground=2e3440
selection-background=eceff4

regular0=3b4252
regular1=bf616a
regular2=96b17f
regular3=c5a565
regular4=81a1c1
regular5=b48ead
regular6=7bb3c3
regular7=a5abb6

bright0=4c566a
bright1=a33a47
bright2=4a6b3a
bright3=b07d0a
bright4=3b5a7a
bright5=6a4a6a
bright6=2a6a7a
bright7=2e3440

# Настройки скроллбэка
[scrollback]
lines=10000

# Настройки курсора
[cursor]
style=block
blink=no

# Главная секция
[main]
# Какая тема загружается при старте: dark или light
initial-color-theme=dark

# Привязки клавиш для переключения тем
# Ctrl+Shift+D — тёмная, Ctrl+Shift+L — светлая
[key-bindings]
color-theme-switch-dark=Control+Shift+d
color-theme-switch-light=Control+Shift+l
